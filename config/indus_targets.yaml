# Indus calibration targets.
#
# Every number carries:
#   value / range      what we calibrate to
#   tolerance          accepted deviation (absolute, same unit as value)
#   reference_n_texts  the corpus size the published number was measured on. Size-dependent
#                      statistics (coverage counts, beginner/ender counts, hapax fraction) are
#                      computed on a random subsample of exactly this many texts, so the
#                      comparison is like-for-like.
#   citation           the source. "VIA" means we read it in a secondary source, not the original.
#   verified           true  = we read the number in the cited source ourselves
#                      false = from the project brief or a secondary source; CHECK BEFORE CITING
#   role               hard        = calibrator must hit it (in the 'full' regime)
#                      report_only = measured and reported, never tuned
#
# Nothing here was invented. Where no published number was found, the entry says so and
# is report_only.

references:
  M77: >-
    Mahadevan, I. (1977). The Indus Script: Texts, Concordance and Tables.
    Memoirs of the Archaeological Survey of India 77. New Delhi.
  YADAV2010: >-
    Yadav, N., Joglekar, H., Rao, R. P. N., Vahia, M. N., Adhikari, R., Mahadevan, I. (2010).
    Statistical analysis of the Indus script using n-grams. PLoS ONE. arXiv:0901.3017.
  FSW2004: >-
    Farmer, S., Sproat, R., Witzel, M. (2004). The collapse of the Indus-script thesis:
    the myth of a literate Harappan civilization. Electronic Journal of Vedic Studies 11(2).
  RAO2018: >-
    Rao, R. P. N. (2018). The Indus script and economics. In: Walking with the Unicorn
    (Kenoyer felicitation volume), Archaeopress, pp. 518-525. arXiv:1812.00049.
  POSSEHL2002: >-
    Possehl, G. L. (2002). The Indus Civilization: A Contemporary Perspective. AltaMira.
    pp. 132-133. (Read VIA the English Wikipedia article "Indus script", accessed 2026-10-03.)
  WELLS2015: >-
    Wells, B. K. (2015). The Archaeology and Epigraphy of Indus Writing. Oxford: Archaeopress.
    (Bibliographic entry as given in RAO2018; 694 signs read VIA RAO2018 and VIA the English
    Wikipedia article "Indus script", accessed 2026-10-03.)
  WELLS2006: >-
    Wells, B. K. (2006). Epigraphic Approaches to Indus Writing. PhD thesis, Harvard University.
    (676 signs read VIA YADAV2010, ref. [4].)
  PARPOLA1994: >-
    Parpola, A. (1994). Deciphering the Indus Script. Cambridge University Press.
    (386 signs read VIA RAO2018.)
  FULS2023: >-
    Fuls, A. (2023). A Catalog of Indus Signs. Self-published (ISBN 9798398422306).
    ("More than 700 distinct signs" read only in the book's publisher/retailer description via a
    web search summary, 2026-10-03; exact count NOT verified.)
  NAIR2026: >-
    Nair, A. (2026). How Non-Linguistic Is the Indus Sign System? A Synthetic-Baseline
    Scorecard. arXiv:2604.17828 (preprint, not peer reviewed). Corpus: ICIT as extracted from
    the "Yajnadevam digital corpus"; data available only on request.
  BRIEF: >-
    Project brief supplied by the benchmark owner (no primary source attached).

targets:
  n_texts:
    value: 2906
    tolerance: 0
    role: hard
    citation: [YADAV2010, M77]
    verified: true
    notes: >-
      VERIFIED: "417 unique signs in 3573 lines of 2906 texts" (YADAV2010 p.2, describing the
      electronic concordance of M77). The earlier project brief gave ~5,500 (unverified, now
      dropped). Other sizes: 1,548 texts in the pruned EBUDS set (YADAV2010); "around 5,000
      inscriptions" known today (Wikipedia, citing a 2025 news report, secondary). Plots mark
      the Indus point at 2,906 and shade the band 1,548-5,500.
    alternatives: {M77_lines: 3573, EBUDS_texts: 1548, brief_superseded: 5500}

  mean_length:
    value: 4.60
    tolerance: 0.25
    role: hard
    citation: [RAO2018, YADAV2010, FSW2004]
    verified: true
    notes: >-
      VERIFIED (derived): M77 has 13,372 sign occurrences (RAO2018) over 2,906 texts (YADAV2010),
      i.e. 4.60 signs per text (3.74 per line). FSW2004 independently states the average is
      "under 4.6". The earlier brief value of 4.4 is superseded.
    alternatives: {M77_derived_per_line: 3.74, brief_superseded: 4.4}

  median_length:
    value: 4
    tolerance: 1
    role: hard
    citation: BRIEF
    verified: false
    notes: >-
      UNVERIFIED (from the earlier brief). YADAV2010 Fig. 2 shows lengths 3 and 5 as the modes
      of EBUDS; we did not find a published median. The tolerance of 1 admits 3-5.

  max_length:
    value: 17
    tolerance: 4
    role: hard
    citation: FSW2004
    verified: true
    notes: >-
      "The longest Indus inscription is only 17 symbols long" (FSW2004). Single-line EBUDS
      texts are at most 14 signs (YADAV2010). Used as a long-tail check, scaled with the
      mean during length sweeps.

  sign_inventory:
    range: [400, 700]
    role: hard
    citation: [M77, POSSEHL2002, WELLS2015]
    verified: partial
    notes: >-
      M77 lists 417 signs (verified in YADAV2010). Possehl (VIA Wikipedia) gives 419;
      Wells (VIA Wikipedia) ~694. Counted as distinct sign types observed in the corpus.

  coverage80_signs:
    value: 69
    tolerance: 15
    reference_n_texts: 1548
    role: hard
    citation: YADAV2010
    verified: true
    notes: >-
      "about 69 signs account for 80% of the total data" (EBUDS, YADAV2010 Sec. 2.2).
      Possehl (VIA Wikipedia) gives 67 signs for M77.

  top1_share:
    value: 0.10
    tolerance: 0.03
    reference_n_texts: 1548
    role: hard
    citation: YADAV2010
    verified: true
    notes: "the most frequent sign (342) alone accounts for 10% of the complete EBUDS"

  hapax_fraction:
    value: 0.27
    tolerance: 0.10
    reference_n_texts: 2906
    role: hard
    citation: POSSEHL2002
    verified: false
    notes: >-
      113 of 419 signs occur only once (POSSEHL2002 VIA Wikipedia) = 0.27 of sign types.
      Secondary source; check Possehl p.132 before citing.

  enders80_signs:
    value: 23
    tolerance: 8
    reference_n_texts: 1548
    role: hard
    citation: YADAV2010
    verified: true
    notes: "only 23 text enders are needed to account for 80% of text ender usage"

  beginners80_signs:
    value: 82
    tolerance: 20
    reference_n_texts: 1548
    role: hard
    citation: YADAV2010
    verified: true
    notes: "Approximately 82 text beginners account for 80% of the text beginner usage"

  zipf_mandelbrot:
    params: {a: 15.39, b: 2.59, c: 44.47}
    form: "log f_r = a - b log(r + c)"
    reference_n_texts: 1548
    role: report_only
    citation: YADAV2010
    verified: true
    notes: >-
      Reported, not tuned: a, b and c are strongly correlated in the fit, so matching
      them adds little beyond the coverage targets. The log base is not stated in the
      paper; we assume natural log, which reproduces the paper's Fig. 4 axis range.

  duplicate_text_fraction:
    role: report_only
    citation: [YADAV2010, NAIR2026]
    verified: partial
    notes: >-
      Not calibrated (no target). Measured values are listed under reference_points below:
      M77 0.354 (0.281 without its four outlier texts), read from the vector data of
      YADAV2010 Fig. 2; ICIT 0.237 per a preprint (NAIR2026, unverified). Our statistic is
      the fraction of texts identical to an earlier text, which is the same definition.


# Published reference points marked on the sensitivity map (reports/sensitivity). NOT targets:
# nothing is calibrated to them.
reference_points:
  duplicate_text_fraction:
    - label: "M77 raw (Yadav 2010 Fig. 2)"
      value: 0.354
      citation: YADAV2010
      verified: true
      method: >-
        Exact series values read from the vector drawing commands of Fig. 2 in arXiv:0901.3017
        (page 3), not by eye. Texts by length 1..14: M77 raw = 177, 608, 473, 429, 368, 225, 169,
        74, 29, 24, 11, 1, 1, 2 (sum 2,591); M77-unique = 82, 215, 309, 292, 308, 209, 136, 60,
        27, 22, 9, 1, 1, 2 (sum 1,673). Check: the EBUDS series from the same figure sums to
        1,548, the published EBUDS size. Duplicate fraction = 1 - 1673/2591 = 0.354.
      caveats: >-
        The plotted raw M77 holds 2,591 texts, not the 2,906 of M77; the paper does not say which
        315 are left out (we guess multi-line or unmeasurable texts, but this is NOT verified).
        Identity is identity of M77 sign readings, so allograph decisions in M77's sign list
        affect the count.
    - label: "M77 without 4 outlier texts"
      value: 0.281
      citation: YADAV2010
      verified: true
      method: "Same figure: 'M77, without 4 most frequent texts' sums to 2,328; 1 - 1673/2328."
    - label: "ICIT (Nair 2026, preprint)"
      value: 0.237
      citation: NAIR2026
      verified: false
      method: "'The raw corpus contains 2,511 inscriptions, of which 595 (24%) are exact duplicates.'"
      caveats: Preprint; corpus not public; extraction pipeline unknown.
  sign_inventory:
    - {label: "Parpola 1994", value: 386, citation: PARPOLA1994, verified: "VIA RAO2018"}
    - {label: "Mahadevan 1977", value: 417, citation: M77, verified: "VIA YADAV2010 and RAO2018"}
    - {label: "Wells 2006", value: 676, citation: WELLS2006, verified: "VIA YADAV2010"}
    - {label: "Wells 2015", value: 694, citation: WELLS2015, verified: "VIA RAO2018"}
    - {label: "Fuls 2023 (>700, unverified)", value: 700, citation: FULS2023, verified: false}
  notes: >-
    Sign-list sizes are catalogue sizes over each author's whole corpus (ICIT-based lists cover
    more texts than M77's 2,906). The map's inventory axis counts sign types observed in a
    2,906-text corpus, so only M77 is like-for-like. The others show where lumping vs splitting
    of variants would place the corpus, approximately and probably too high.
# Calibration regimes (Judge fix #2: make circularity measurable instead of hidden).
regimes:
  full:
    description: All 'hard' targets above.
    targets: [n_texts, mean_length, median_length, max_length, sign_inventory,
              coverage80_signs, top1_share, hapax_fraction, enders80_signs, beginners80_signs]
  holdout:
    description: >-
      Only size, length and inventory are calibrated. Frequency-concentration and positional
      statistics (what methods 1-3 measure) are left free, so methods cannot be "rewarded"
      for statistics we injected.
    targets: [n_texts, mean_length, median_length, max_length, sign_inventory]
  wrong_prior:
    description: >-
      Deliberately mismatched targets (longer texts, smaller inventory). If method
      rankings flip under this regime, rankings are generator-dependent.
    targets: [n_texts, mean_length, median_length, max_length, sign_inventory]
    overrides:
      mean_length: {value: 8.0, tolerance: 0.5}
      median_length: {value: 8, tolerance: 1}
      max_length: {value: 25, tolerance: 6}
      sign_inventory: {range: [150, 260]}
