# Experiment profiles. `ibdb reproduce --profile full` regenerates every table and figure.
# Every random draw descends from master_seed via numpy SeedSequence, so the same profile
# gives the same numbers on any machine with the same package versions.
master_seed: 20261003

profiles:
  full:
    seeds: [0, 1, 2]
    # Size sweep at Indus mean length, length sweep at Indus size.
    size_sweep: [500, 1000, 2000, 2906, 5500, 10000, 20000, 50000]
    length_sweep: [3.0, 4.6, 6.0, 10.0, 20.0]
    indus_point: {n_texts: 2906, mean_length: 4.6}
    languages: [sanskrit, tamil, sumerian, latin, finnish]
    script_types: [logographic, syllabic, logosyllabic, alphabetic]
    controls: [heraldry, admin_tags, emblem_markov, adversarial, rao_type1, rao_type2, kamon]
    knowledge_tiers: [related, candidates, none]
    feasibility_scenarios: 120     # random generator-parameter draws at the Indus point
    # Sister-language distance (sound_change_rate, lexical_replacement), Indus point, tiers related +
    # candidates. Level 2 is the default used everywhere else (sister_language below).
    sister_sweep: [[0.10, 0.05], [0.30, 0.20], [0.50, 0.35], [0.70, 0.50]]
    regimes: [full, holdout, wrong_prior]
    em_restarts: 3
    em_iterations: 60
  smoke:   # seconds-scale end-to-end check of the pipeline (not for results)
    seeds: [0]
    size_sweep: [500, 2000, 2906]
    length_sweep: [3.0, 4.6]
    indus_point: {n_texts: 2906, mean_length: 4.6}
    languages: [sanskrit, latin, finnish]
    script_types: [syllabic, logographic]
    controls: [heraldry, admin_tags, emblem_markov]
    knowledge_tiers: [related, candidates, none]
    feasibility_scenarios: 3
    sister_sweep: [[0.10, 0.05], [0.50, 0.35]]
    regimes: [full]
    em_restarts: 1
    em_iterations: 20
  quick:
    seeds: [0]
    size_sweep: [500, 2906, 20000]
    length_sweep: [3.0, 4.6, 10.0]
    indus_point: {n_texts: 2906, mean_length: 4.6}
    languages: [sanskrit, tamil, sumerian, latin, finnish]
    script_types: [logographic, syllabic, logosyllabic, alphabetic]
    controls: [heraldry, admin_tags, emblem_markov, adversarial, rao_type1, rao_type2, kamon]
    knowledge_tiers: [related, candidates, none]
    feasibility_scenarios: 16
    sister_sweep: [[0.10, 0.05], [0.30, 0.20], [0.50, 0.35], [0.70, 0.50]]
    regimes: [full, holdout, wrong_prior]
    em_restarts: 2
    em_iterations: 40

# Generator defaults (overridden per scenario in the feasibility sweep).
generator:
  allograph_rate: 0.25        # fraction of values that get graphic variants
  homophony_rate: 0.10        # fraction of values written with >1 lexically conditioned sign
  polyvalence_rate: 0.05      # fraction of signs carrying a second value
  determinatives: auto        # on for logosyllabic, off otherwise
  word_divider: false         # Indus has no agreed word divider
  direction: rtl              # stored in physical order; public metadata states direction
  logogram_vocab: 250         # logosyllabic: this many most frequent words get logograms

# Synthetic relative used in knowledge tiers 'related' and 'candidates'.
# THIS IS A DESIGN CHOICE THAT DIRECTLY MOVES TASK-D NUMBERS. Reported in every table.
sister_language:
  sound_change_rate: 0.30     # fraction of phonemes rewritten by regular correspondences
  lexical_replacement: 0.20   # fraction of word types replaced by unrelated forms

# Blind challenge. Sumerian stays in internal experiments (with CDLI citation) but is excluded from
# every published challenge round until CDLI confirms its reuse terms cover redistribution of
# derived material (see DATA_LICENSES.md).
challenge:
  exclude_sources: [sumerian]
